<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Make window.fetch safely writable/settable for browser extensions & request interceptors
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var _nativeFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _nativeFetch;
              },
              set: function(newFetch) {
                _nativeFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {}
      })();

      // Suppress third-party browser extension content script errors from polluting UI
      window.addEventListener('error', function(event) {
        if (event && event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
        if (event && event.message && event.message.indexOf('Cannot set property fetch') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
    <title>FLEXI - Gym Management System</title>
